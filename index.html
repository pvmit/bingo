<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bingo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="setup" class="screen">
    <header class="brand">
      <h1>Bingo</h1>
      <p class="sub">Jedna gra · wspólna plansza · bez konta</p>
    </header>

    <label class="field">
      <span>Rozmiar planszy</span>
      <select id="size">
        <option value="3">3×3</option>
        <option value="4">4×4</option>
        <option value="5" selected>5×5</option>
      </select>
    </label>

    <label class="field">
      <span>Gracze (po przecinku)</span>
      <input id="names" type="text" placeholder="Ania, Bartek, Celina" autocomplete="off" />
    </label>

    <div class="actions">
      <button type="button" id="btn-new" class="primary">Nowa gra</button>
    </div>

    <p id="setup-error" class="error" hidden></p>
  </div>

  <div id="game" class="screen hidden">
    <header class="topbar">
      <div>
        <strong id="room-code">BINGO</strong>
        <span class="muted" id="active-label"></span>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-copy" class="ghost small">Kopiuj link</button>
        <button type="button" id="btn-leave" class="ghost small">Nowa</button>
      </div>
    </header>

    <ul id="players" class="players"></ul>
    <p id="winner" class="winner hidden"></p>
    <div id="board" class="board" role="grid"></div>
  </div>

  <script src="goals.js"></script>
  <script src="app.js"></script>
</body>
</html>
