<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bingo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="setup" class="screen">
    <header class="brand">
      <h1>Bingo</h1>
      <p class="sub">Jedna gra · wspólna plansza · sync na żywo</p>
    </header>

    <p id="firebase-warn" class="warn hidden">
      Uzupełnij <code>firebase-config.js</code> — bez Firebase sync nie działa.
    </p>

    <label class="field">
      <span>Nick</span>
      <input id="nick" type="text" maxlength="20" placeholder="Twoje imię" autocomplete="nickname" />
    </label>

    <label class="field">
      <span>Rozmiar planszy</span>
      <select id="size">
        <option value="3">3×3</option>
        <option value="4">4×4</option>
        <option value="5" selected>5×5</option>
      </select>
    </label>

    <div class="actions">
      <button type="button" id="btn-new" class="primary">Nowa gra</button>
    </div>

    <div class="join-row">
      <label class="field grow">
        <span>Kod pokoju</span>
        <input id="code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off" />
      </label>
      <button type="button" id="btn-join" class="ghost">Dołącz</button>
    </div>

    <p id="setup-error" class="error" hidden></p>
  </div>

  <div id="game" class="screen hidden">
    <header class="topbar">
      <div>
        <strong id="room-code">----</strong>
        <span class="muted" id="you-label"></span>
      </div>
      <button type="button" id="btn-leave" class="ghost small">Wyjdź</button>
    </header>

    <ul id="players" class="players"></ul>
    <p id="winner" class="winner hidden"></p>
    <div id="board" class="board" role="grid"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="goals.js"></script>
  <script src="app.js"></script>
</body>
</html>
